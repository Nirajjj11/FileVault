{% extends "base.html" %}

{% block title %}
Rename File
{% endblock %}

{% block content %}

<div class="container py-5">

      <div class="row justify-content-center">

            <div class="col-md-6">

                  <div class="card shadow-sm border-0">

                        <div class="card-body p-4">

                              <h3 class="fw-bold mb-4">
                                    Rename File
                              </h3>

                              <form method="post">

                                    {% csrf_token %}

                                    <div class="mb-4">

                                          <label class="form-label">
                                                File Name
                                          </label>

                                          {{ form.original_name }}

                                          {% for error in form.original_name.errors %}
                                          <div class="text-danger small">
                                                {{ error }}
                                          </div>
                                          {% endfor %}

                                    </div>

                                    <button type="submit" class="btn btn-primary">
                                          Save Changes
                                    </button>

                                    <a href="{{ object.folder.get_absolute_url }}" class="btn btn-outline-secondary">
                                          Cancel
                                    </a>

                              </form>

                        </div>

                  </div>

            </div>

      </div>

</div>

{% endblock %}
