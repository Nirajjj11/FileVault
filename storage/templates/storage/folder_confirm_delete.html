{% extends "base.html" %}

{% block title %}
Delete File
{% endblock %}

{% block content %}

<div class="container py-5">

      <div class="row justify-content-center">

            <div class="col-md-6">

                  <div class="card shadow-sm border-0">

                        <div class="card-body p-4">

                              <h3 class="fw-bold">
                                    Delete File
                              </h3>

                              <p class="text-muted mt-3">
                                    Are you sure you want to delete
                                    <strong>{{ object.original_name }}</strong>?
                              </p>

                              <p class="text-danger">
                                    This action cannot be undone.
                              </p>

                              <form method="post">

                                    {% csrf_token %}

                                    <button type="submit" class="btn btn-danger">
                                          Yes, Delete
                                    </button>

                                    <a href="{{ object.folder.get_absolute_url }}" class="btn btn-outline-secondary">
                                          Cancel
                                    </a>

                              </form>

                        </div>

                  </div>

            </div>

      </div>

</div>

{% endblock %}
